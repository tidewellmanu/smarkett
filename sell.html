<!doctype html>
<html lang="en-GH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#D90429"><meta name="description" content="MarketHub Ghana marketplace">
<title>Post a listing — MarketHub Ghana</title><link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body><div id="site-header"></div><main class="container page narrow"><div class="page-title"><span class="eyebrow">Sell</span><h1>Post a listing</h1></div><p id="auth-note" class="form-status">Sign in to post a listing.</p><form id="listing-form" class="form-card"><label>Title<input id="title" maxlength="100" required></label><label>Description<textarea id="description" maxlength="5000" required></textarea></label><div class="form-grid"><label>Category<select id="category" required></select></label><label>Location<select id="location" required></select></label></div><div class="form-grid"><label>Price<input id="price" type="number" min="0" step="0.01" required></label><label>Condition<select id="condition"><option>New</option><option>Used</option><option>Refurbished</option></select></label></div><label>Images<input id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="image-preview" class="image-preview"></div><label class="check"><input id="negotiable" type="checkbox"> Price is negotiable</label><button class="btn btn-primary" type="submit">Publish listing</button><p id="form-status" class="form-status"></p></form></main><div id="site-footer"></div><div id="mobile-nav"></div><script src="sw-reset.js"></script><script type="module" src="js/app.js"></script><script type="module" src="js/sell.js"></script></body></html>
